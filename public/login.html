<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="auth"><div class="card"><p class="eyebrow">NOVA ANIME</p><h1>Member Login</h1><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg" class="tiny"></p><a href="/">Back</a></div></main>
<script>async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let d=await r.json();if(r.ok)location='/';else msg.textContent=d.error}</script></body></html>
